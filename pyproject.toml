[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-octopus-energy-japan"
version = "0.9.2"
description = "Unofficial Home Assistant integration for Octopus Energy Japan"
readme = "README.md"
requires-python = ">=3.14.2"
license = { text = "MIT" }
authors = [{ name = "SteveShin323" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
]

dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "hypothesis>=6.100",
  "ruff>=0.11",
  "mypy>=1.15",
  "aiohttp>=3.11",
  "PyYAML>=6.0",
  "pytest-homeassistant-custom-component>=0.13.338,<0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
pythonpath = ["."]
markers = [
  "recorder_harness: starts the real Home Assistant recorder before custom integration setup",
]

[tool.coverage.run]
branch = true
source = ["custom_components/octopus_energy_japan"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
  "ASYNC",
  "DTZ",
  "SIM",
  "RUF",
]
ignore = [
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = "homeassistant.*"
ignore_missing_imports = true
