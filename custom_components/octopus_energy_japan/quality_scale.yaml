rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration is read-only and exposes no actions.
  appropriate-polling: done
  brands:
    status: todo
    comment: >-
      Icon and logo exist under brand/. They must be submitted to
      home-assistant/brands, which cannot be done before the domain is public.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration is read-only and exposes no actions.
  docs-conditions:
    status: exempt
    comment: The integration exposes no conditions.
  docs-high-level-description:
    status: done
    comment: docs/USER_GUIDE.md, section 'What it does', plus the README summary.
  docs-installation-instructions:
    status: done
    comment: docs/USER_GUIDE.md#installation and docs/ja/README.md.
  docs-removal-instructions:
    status: done
    comment: docs/USER_GUIDE.md#removing-the-integration, including what deliberately survives.
  docs-triggers:
    status: exempt
    comment: The integration exposes no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration is read-only and exposes no actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment: docs/USER_GUIDE.md#configuration-parameters. Nothing is typed during setup.
  docs-installation-parameters:
    status: done
    comment: docs/USER_GUIDE.md#configuration-parameters. Only the Application Credentials client ID.
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: OEJP is an authenticated cloud service and cannot advertise user accounts to Home Assistant.
  discovery-update-info:
    status: exempt
    comment: The integration has no local network endpoint updated through Home Assistant discovery.
  docs-data-update:
    status: done
    comment: docs/USER_GUIDE.md#how-data-updates, including provider delay and correction behaviour.
  docs-examples:
    status: done
    comment: docs/USER_GUIDE.md#typical-uses.
  docs-known-limitations:
    status: done
    comment: docs/USER_GUIDE.md#known-limitations, each with recorded evidence.
  docs-supported-devices:
    status: done
    comment: docs/USER_GUIDE.md#what-it-supports. There is no hardware to pair.
  docs-supported-functions:
    status: done
    comment: docs/USER_GUIDE.md#entities.
  docs-troubleshooting:
    status: done
    comment: docs/USER_GUIDE.md#troubleshooting and docs/ja/README.md.
  docs-use-cases:
    status: done
    comment: docs/USER_GUIDE.md#typical-uses.
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations:
    status: exempt
    comment: >-
      The integration is read-only, exposes no actions, and raises no user-facing
      HomeAssistantError. Setup and authorization failures use Home Assistant's own
      ConfigEntryNotReady and ConfigEntryAuthFailed, whose text Home Assistant owns.
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: >-
      Four informational issues cover corrupt ledger partitions, a silent reading
      series, a lost reading capability, and a commercial permission gap. None is
      fixable in place because every condition is provider-side or storage-side, so
      no repair flow is offered. Reauthentication is left to Home Assistant's own
      prompt. See docs/DIAGNOSTICS_AND_REPAIRS.md.
  stale-devices:
    status: done
    comment: >-
      A supply point or account that stops being discovered is disabled through
      DeviceEntryDisabler.INTEGRATION rather than removed, and is re-enabled if it
      reappears. Removal is deliberately avoided so ledger history and external
      statistics stay continuous, as Design v3 section 3 requires. A user can still
      delete a disabled device manually.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
