rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration is read-only and exposes no actions.
  appropriate-polling: done
  brands:
    status: todo
    comment: >-
      Icon and logo exist under brand/. They must be submitted to
      home-assistant/brands, which cannot be done before the domain is public.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration is read-only and exposes no actions.
  docs-conditions:
    status: exempt
    comment: The integration exposes no conditions.
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: The integration exposes no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration is read-only and exposes no actions.
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: OEJP is an authenticated cloud service and cannot advertise user accounts to Home Assistant.
  discovery-update-info:
    status: exempt
    comment: The integration has no local network endpoint updated through Home Assistant discovery.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations:
    status: exempt
    comment: >-
      The integration is read-only, exposes no actions, and raises no user-facing
      HomeAssistantError. Setup and authorization failures use Home Assistant's own
      ConfigEntryNotReady and ConfigEntryAuthFailed, whose text Home Assistant owns.
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: >-
      Four informational issues cover corrupt ledger partitions, a silent reading
      series, a lost reading capability, and a commercial permission gap. None is
      fixable in place because every condition is provider-side or storage-side, so
      no repair flow is offered. Reauthentication is left to Home Assistant's own
      prompt. See docs/DIAGNOSTICS_AND_REPAIRS.md.
  stale-devices:
    status: done
    comment: >-
      A supply point or account that stops being discovered is disabled through
      DeviceEntryDisabler.INTEGRATION rather than removed, and is re-enabled if it
      reappears. Removal is deliberately avoided so ledger history and external
      statistics stay continuous, as Design v3 section 3 requires. A user can still
      delete a disabled device manually.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
